<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f8faf9; color:#14251d; font-family:Pretendard,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#12855b; text-decoration:none; }
  a:hover { color:#0c6644; }
  button { font-family:inherit; }
  image-slot[id^="detail-"]::part(frame){background:transparent}
</style>
<script src="./image-slot.js"></script>
</helmet>
<div style="width:100%; min-height:100vh; display:flex; flex-direction:column">
  <header style="position:sticky; top:0; z-index:50; padding:12px 16px">
    <div style="max-width:1080px; margin:0 auto; padding:12px 16px 12px 12px; border-radius:22px; display:flex; align-items:center; gap:18px">
      <button type="button" onClick="{{ goBack }}" aria-label="뒤로 가기" style="margin-right:auto; width:40px; height:40px; border:none; border-radius:50%; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#14251d" style-hover="background:rgba(20,37,29,0.06)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <nav style="display:{{ navDisp }}; gap:22px; padding-right:16px; font-size:14px; font-weight:600; color:#4e6259">
        <a href="index.html" style="color:inherit">인터넷</a><a href="index.html#how" style="color:inherit">신청방법</a><a href="faq.html" style="color:inherit">FAQ</a>
      </nav>
    </div>
  </header>

  <main style="flex:1; padding:20px 20px 96px">
    <div style="max-width:1000px; margin:0 auto">
      <div style="font-size:13px; font-weight:600; color:#8aa197"><a href="rental.html" style="color:inherit">가전 렌탈</a> <span style="margin:0 4px">›</span> {{ product.category }}</div>

      <div style="margin-top:18px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:40px; align-items:start">
        <div style="min-width:0">
          <div style="position:relative; width:100%; aspect-ratio:1 / 1; border-radius:24px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(20,37,29,0.05); overflow:hidden">
            <div style="position:absolute; inset:10%"><image-slot id="{{ mainSlot }}" fit="contain" shape="rect" placeholder="대표 이미지" style="width:100%; height:100%"></image-slot></div>
          </div>
          <div style="margin-top:12px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px">
            <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
              <div style="position:relative; aspect-ratio:1 / 1; border-radius:14px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(20,37,29,0.05); overflow:hidden"><div style="position:absolute; inset:10%"><image-slot id="{{ t.slot }}" fit="contain" shape="rect" placeholder="이미지" style="width:100%; height:100%"></image-slot></div></div>
            </sc-for>
          </div>
        </div>

        <div style="min-width:0">
          <div style="display:flex; align-items:flex-start; gap:12px">
            <div style="flex:1; min-width:0">
              <div style="font-size:13.5px; font-weight:600; color:#9aa8a1">{{ product.brand }}</div>
              <h1 style="margin:6px 0 0; font-size:clamp(22px,2.8vw,28px); line-height:1.3; letter-spacing:-0.03em; font-weight:800; text-wrap:pretty">{{ product.name }}</h1>
            </div>
            <button type="button" onClick="{{ share }}" aria-label="공유하기" style="flex:none; width:40px; height:40px; border:none; border-radius:50%; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(20,37,29,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#4e6259" style-hover="color:#12855b; box-shadow:inset 0 0 0 1px #12855b"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><circle cx="18" cy="5.5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="18.5" r="2.5"></circle><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"></path></svg></button>
          </div>
          <sc-if value="{{ copied }}" hint-placeholder-val="{{ false }}"><div style="margin-top:8px; font-size:12.5px; font-weight:600; color:#12855b">링크가 복사되었어요.</div></sc-if>

          <div style="margin-top:18px; display:flex; align-items:baseline; gap:6px">
            <span style="font-size:14px; font-weight:600; color:#4e6259">월</span>
            <span style="font-size:30px; font-weight:800; letter-spacing:-0.03em">{{ priceText }}</span>
            <span style="font-size:15px; font-weight:700">원</span>
          </div>
          <div style="margin-top:6px; font-size:13.5px; font-weight:600; color:#12855b">{{ product.benefit }}</div>

          <div style="margin-top:26px; padding-top:22px; border-top:1px solid #e8ece9; display:grid; gap:22px">
            <div>
              <div style="display:flex; align-items:baseline; gap:8px"><span style="font-size:14px; font-weight:700">색상</span><span style="font-size:13px; color:#8aa197">{{ colorName }}</span></div>
              <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:10px">
                <sc-for list="{{ colors }}" as="c" hint-placeholder-count="3">
                  <button type="button" onClick="{{ c.pick }}" aria-label="{{ c.label }}" style="width:36px; height:36px; padding:0; border:none; border-radius:50%; background:{{ c.hex }}; box-shadow:{{ c.ring }}; cursor:pointer; transition:box-shadow 0.2s ease"></button>
                </sc-for>
              </div>
            </div>
            <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
              <div>
                <div style="font-size:14px; font-weight:700">{{ g.title }}</div>
                <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px">
                  <sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="3">
                    <button type="button" onClick="{{ o.pick }}" style="flex:1 1 auto; padding:12px 16px; border:none; border-radius:12px; background:{{ o.bg }}; box-shadow:{{ o.ring }}; color:{{ o.fg }}; font-size:14px; font-weight:700; cursor:pointer; transition:background 0.2s ease, box-shadow 0.2s ease">{{ o.label }}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>

          <button type="button" onClick="{{ openCall }}" style="margin-top:26px; width:100%; padding:18px; border:none; border-radius:14px; background:#e9ecea; color:#4e6259; font-size:16px; font-weight:800; letter-spacing:-0.02em; cursor:pointer; transition:background 0.2s ease, color 0.2s ease, transform 0.15s ease" style-hover="background:#12855b; color:#ffffff" style-active="background:#0c6644; color:#ffffff; transform:scale(0.98)">전화 상담 받기</button>
        </div>
      </div>

      <section style="margin-top:80px">
        <div style="padding-bottom:16px; border-bottom:1px solid #e8ece9; font-size:18px; font-weight:800; letter-spacing:-0.02em">상품 상세</div>
        <div style="margin:28px auto 0; max-width:760px; display:grid; gap:16px">
          <sc-for list="{{ detailSlots }}" as="d" hint-placeholder-count="3">
            <div style="width:100%; aspect-ratio:4 / 3; border-radius:20px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(20,37,29,0.05); overflow:hidden"><image-slot id="{{ d.slot }}" fit="cover" shape="rect" placeholder="상세 이미지를 끌어다 놓으세요" style="width:100%; height:100%"></image-slot></div>
          </sc-for>
        </div>
        <sc-if value="{{ detailMore }}" hint-placeholder-val="{{ true }}">
          <div style="margin-top:24px; display:flex; justify-content:center">
            <button type="button" onClick="{{ expandDetail }}" style="display:flex; align-items:center; gap:6px; padding:14px 28px; border:none; border-radius:999px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(20,37,29,0.1); color:#14251d; font-size:14.5px; font-weight:700; cursor:pointer" style-hover="box-shadow:inset 0 0 0 1px #12855b; color:#12855b">자세히 보기<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M6 9l6 6 6-6"></path></svg></button>
          </div>
        </sc-if>
        <sc-if value="{{ detailLess }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:24px; display:flex; justify-content:center">
            <button type="button" onClick="{{ collapseDetail }}" style="display:flex; align-items:center; gap:6px; padding:14px 28px; border:none; border-radius:999px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(20,37,29,0.1); color:#14251d; font-size:14.5px; font-weight:700; cursor:pointer" style-hover="box-shadow:inset 0 0 0 1px #12855b; color:#12855b">간략하게<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M6 15l6-6 6 6"></path></svg></button>
          </div>
        </sc-if>
      </section>
    </div>
  </main>
  <div style="position:fixed; right:18px; bottom:18px; z-index:60; display:flex; flex-direction:column; gap:10px">
    <button type="button" onClick="{{ toTop }}" aria-label="맨 위로" style="width:46px; height:46px; padding:0; border:none; cursor:pointer; border-radius:50%; background:#ffffff; color:#14251d; box-shadow:0 6px 18px rgba(20,37,29,0.14), inset 0 0 0 1px rgba(20,37,29,0.08); display:flex; align-items:center; justify-content:center; transition:transform 0.2s ease" style-hover="transform:scale(1.06)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M6 15l6-6 6 6"></path></svg></button>
    <button type="button" onClick="{{ openKakao }}" aria-label="카카오톡 채널 상담" style="width:46px; height:46px; padding:0; border:none; cursor:pointer; border-radius:50%; background:#FEE500; color:#191919; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,0.16)" style-hover="transform:translateY(-2px); box-shadow:0 12px 26px rgba(0,0,0,0.2)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="display:block"><path fill="#191919" d="M12 3.6c-5 0-9 3.1-9 7 0 2.5 1.7 4.7 4.2 6l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.3 0 .7.1 1 .1 5 0 9-3.1 9-7s-4-7.3-9-7.3z"></path></svg>
    </button>
    <button type="button" onClick="{{ openCall }}" aria-label="전화 상담 070-4647-1124" style="width:46px; height:46px; padding:0; border:none; cursor:pointer; border-radius:50%; background:#0c6644; color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(12,102,68,0.34)" style-hover="transform:translateY(-2px); box-shadow:0 12px 26px rgba(12,102,68,0.42)">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:block"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"></path></svg>
    </button>
  </div>
  <sc-if value="{{ callOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeCall }}" style="position:fixed; inset:0; z-index:80; background:rgba(20,37,29,0.45); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px">
      <div role="dialog" aria-modal="true" aria-label="전화 상담" onClick="{{ stop }}" style="width:100%; max-width:340px; padding:30px 26px 24px; border-radius:24px; background:#fff; box-shadow:0 24px 60px rgba(20,37,29,0.25); text-align:center">
        <div style="font-size:14px; font-weight:700; color:#8aa197">전화 상담</div>
        <div style="margin-top:8px; font-size:28px; font-weight:800; letter-spacing:-0.03em; color:#14251d">070-4647-1124</div>
        <div style="margin-top:6px; font-size:13px; color:#8aa197">평일 10:00 - 19:00</div>
        <div style="margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:8px">
          <button type="button" onClick="{{ closeCall }}" style="padding:15px; border:none; border-radius:14px; background:#f2f2f2; color:#3d3d3d; font-size:15px; font-weight:700; cursor:pointer">닫기</button>
          <a href="tel:070-4647-1124" target="_top" style="display:flex; align-items:center; justify-content:center; text-align:center; padding:15px; border-radius:14px; background:#0c6644; color:#fff; font-size:15px; font-weight:700">전화 연결</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // 상품별로 이 객체만 바꿔서 사용하세요.
  product = {
    id: "dishwasher-01",
    category: "식기세척기",
    brand: "회사A",
    name: "12인용 빌트인 식기세척기",
    benefit: "설치비 무료 · 인터넷 결합 시 추가 할인",
    colors: [["화이트", "#f4f5f2"], ["실버", "#c9ced3"], ["블랙", "#2b2f33"]],
    groups: [
      { key: "type", title: "종류", opts: ["12인용 빌트인", "12인용 프리스탠딩", "14인용 빌트인"] },
      { key: "term", title: "약정 기간", opts: ["3년", "4년", "5년", "6년"] },
      { key: "care", title: "관리 방법", opts: ["방문 관리", "자가 관리"] }
    ],
    // 기본가 + 옵션별 가감(원)
    base: 39900,
    delta: { type: [0, -3000, 6000], term: [6000, 3000, 0, -2000], care: [0, -4000] },
    detailImages: 5
  };
  state = { color: 0, sel: { type: 0, term: 2, care: 0 }, callOpen: false, copied: false, mob: false };
  componentDidMount() { this._r = () => { const m = window.innerWidth < 720; if (m !== this.state.mob) this.setState({ mob: m }); }; window.addEventListener("resize", this._r); this._r(); }
  componentWillUnmount() { window.removeEventListener("resize", this._r); clearTimeout(this._ct); }
  renderVals() {
    const p = this.product, s = this.state, accent = "#12855b";
    let price = p.base;
    Object.keys(p.delta).forEach(k => { price += p.delta[k][s.sel[k] || 0] || 0; });
    return {
      product: p,
      navDisp: s.mob ? "none" : "flex",
      mainSlot: "detail-" + p.id + "-main",
      thumbs: [1, 2, 3, 4].map(n => ({ slot: "detail-" + p.id + "-thumb" + n })),
      detailSlots: Array.from({ length: s.detailOpen ? p.detailImages : Math.min(2, p.detailImages) }, (_, i) => ({ slot: "detail-" + p.id + "-info" + (i + 1) })),
      detailMore: !s.detailOpen && p.detailImages > 2,
      detailLess: !!s.detailOpen && p.detailImages > 2,
      expandDetail: () => this.setState({ detailOpen: true }),
      collapseDetail: () => this.setState({ detailOpen: false }),
      priceText: price.toLocaleString("ko-KR"),
      colorName: p.colors[s.color][0],
      colors: p.colors.map(([label, hex], i) => ({ label, hex, ring: i === s.color ? "0 0 0 2px #ffffff, 0 0 0 4px " + accent : "inset 0 0 0 1px rgba(20,37,29,0.15)", pick: () => this.setState({ color: i }) })),
      groups: p.groups.map(g => ({ title: g.title, opts: g.opts.map((label, i) => { const on = (s.sel[g.key] || 0) === i; return { label, bg: on ? "#ffffff" : "#f2f2f2", fg: on ? accent : "#666666", ring: on ? "inset 0 0 0 1.5px " + accent : "none", pick: () => this.setState(st => ({ sel: { ...st.sel, [g.key]: i } })) }; }) })),
      goBack: () => { if (window.history.length > 1) window.history.back(); else window.location.href = "rental.html"; },
      share: () => {
        const url = window.location.href;
        if (navigator.share) { navigator.share({ title: p.name, url }).catch(() => {}); return; }
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { this.setState({ copied: true }); clearTimeout(this._ct); this._ct = setTimeout(() => this.setState({ copied: false }), 2000); }).catch(() => {});
      },
      copied: s.copied,
      toTop: () => window.scrollTo({ top: 0, behavior: "smooth" }),
      openKakao: () => { window.open("https://open.kakao.com/o/sAU2tjTi", "_blank", "noopener"); },
      callOpen: s.callOpen,
      openCall: () => this.setState({ callOpen: true }),
      closeCall: () => this.setState({ callOpen: false }),
      stop: e => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
